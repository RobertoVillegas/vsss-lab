[package]
name = "vsss-python"
description = "Native Python batch bindings for VSSS Lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
vsss-batch = { path = "../vsss-batch" }
vsss-physics-api = { path = "../vsss-physics-api" }
vsss-physics-rapier = { path = "../vsss-physics-rapier" }
vsss-spec = { path = "../vsss-spec" }

[lints]
workspace = true

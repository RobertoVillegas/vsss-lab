[project]
name = "vsss-lab"
version = "0.0.0"
description = "Bootstrap workspace for the VSSS Lab platform"
readme = "README.md"
requires-python = "==3.13.*"
license = "Apache-2.0"
authors = [{ name = "Roberto Villegas" }]
dependencies = []

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
  "gymnasium>=1.2,<2",
  "maturin>=1.9,<2",
  "mypy>=1.17,<2",
  "numpy>=2.3,<3",
  "pettingzoo>=1.25,<2",
  "pytest>=8.4,<9",
]

[tool.uv]
package = false

[tool.maturin]
manifest-path = "crates/vsss-python/Cargo.toml"
python-source = "python"
module-name = "vsss_env._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  "experiments",
  "runs",
  "checkpoints",
  "docs/PRD_VSSS_Lab_Plataforma_RL_Multiagente.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["pettingzoo", "pettingzoo.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vsss_env.adapters"
disallow_subclassing_any = false

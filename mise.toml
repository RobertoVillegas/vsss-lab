min_version = "2026.7.14"

[settings]
python.uv_venv_auto = "source"
lockfile = true

[tools]
python = "3.13.14"
rust = { version = "1.97.1", profile = "minimal", components = "clippy,rustfmt" }
uv = "0.11.32"
ruff = "0.16.0"
just = "1.57.0"
bun = "1.3.1"
flatc = "25.12.19"

[tasks.bootstrap]
description = "Install locked project dependencies"
run = [
  "uv sync --locked",
  "cargo fetch --locked",
  "bun install --cwd web/replay-viewer --frozen-lockfile",
]

[tasks.bindings]
description = "Build and install the native Python extension"
depends = ["bootstrap"]
run = "uv run maturin develop --release"

[tasks.train-env]
description = "Install locked training dependencies and native Python extension"
run = [
  "uv sync --group train --locked",
  "uv run maturin develop --release",
]

[tasks.doctor]
description = "Validate host and project invariants"
run = "bash tools/doctors/doctor.sh"

[tasks.build]
description = "Build Rust and validate Python sources"
depends = ["bindings"]
run = [
  "just protocol-check",
  "cargo build --workspace --locked",
  "uv run python -m compileall -q python tests tools",
  "bun run --cwd web/replay-viewer build",
]

[tasks.test]
description = "Run Rust and Python test suites"
depends = ["bindings"]
run = [
  "cargo test --workspace --locked",
  "bun run --cwd web/replay-viewer test",
  "uv sync --group train --locked",
  "uv run maturin develop --release",
  "uv run pytest -q",
]

[tasks.lint]
description = "Run all static checks"
depends = ["bootstrap"]
run = [
  "uv sync --group train --locked",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "ruff check .",
  "ruff format --check .",
  "uv run mypy tests python/vsss_env python/vsss_baselines python/vsss_eval python/vsss_train python/vsss_league tools/replay_viewer tools/replay_web tools/benchmark_observer.py tools/benchmark_marl.py",
  "bun run --cwd web/replay-viewer typecheck",
]

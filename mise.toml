min_version = "2026.7.14"

[settings]
python.uv_venv_auto = "source"
lockfile = true

[tools]
python = "3.13.14"
rust = { version = "1.97.1", profile = "minimal", components = "clippy,rustfmt" }
uv = "0.11.32"
ruff = "0.16.0"
just = "1.57.0"

[tasks.bootstrap]
description = "Install locked project dependencies"
run = [
  "uv sync --locked",
  "cargo fetch --locked",
]

[tasks.bindings]
description = "Build and install the native Python extension"
depends = ["bootstrap"]
run = "uv run maturin develop --release"

[tasks.doctor]
description = "Validate host and project invariants"
run = "bash tools/doctors/doctor.sh"

[tasks.build]
description = "Build Rust and validate Python sources"
depends = ["bindings"]
run = [
  "cargo build --workspace --locked",
  "uv run python -m compileall -q python tests tools",
]

[tasks.test]
description = "Run Rust and Python test suites"
depends = ["bindings"]
run = [
  "cargo test --workspace --locked",
  "uv run pytest -q",
]

[tasks.lint]
description = "Run all static checks"
depends = ["bootstrap"]
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "ruff check .",
  "ruff format --check .",
  "uv run mypy tests python/vsss_env",
]

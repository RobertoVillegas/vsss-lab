[workspace]
members = [
    "crates/vsss-batch",
    "crates/vsss-controller",
    "crates/vsss-match-server",
    "crates/vsss-physics-api",
    "crates/vsss-physics-rapier",
    "crates/vsss-protocol",
    "crates/vsss-python",
    "crates/vsss-spec",
    "crates/vsss-viewer-2d",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/RobertoVillegas/vsss-lab"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
